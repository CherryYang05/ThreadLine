name: 问题反馈
description: 报告规格、文档、开发工具或实现中的问题。
body:
  - type: textarea
    id: problem
    attributes:
      label: 问题与影响
      description: 说明遇到的问题、影响范围及所用分支或提交。
    validations:
      required: true
  - type: textarea
    id: specification
    attributes:
      label: 关联规格（可选）
      description: 填写 PRD 章节、OpenSpec change 或 Requirement ID，例如 TL-CAP-001。
  - type: textarea
    id: reproduction
    attributes:
      label: 复现与预期
      description: 列出复现步骤、预期行为和实际结果；文档问题可提供文件位置。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 验证证据（可选）
      description: 提供实际执行的命令、退出状态或脱敏截图；未验证请说明。不要上传凭据或私人学习记录。
